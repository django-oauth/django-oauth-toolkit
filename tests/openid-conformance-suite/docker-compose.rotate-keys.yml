# Rotates the IdP's ID Token signing key for the oidcc-server-rotate-keys module,
# a manual step that run.py and CI never take (see "Rotating the signing key" in
# README.md). Layered over docker-compose.yml, it recreates dot-idp signing with
# .certs/rotated-key.pem and still publishing .certs/original-key.pem in its JWKS.

services:
  dot-idp:
    environment:
      OAUTH2_PROVIDER_OIDC_RSA_PRIVATE_KEY_FILE: /certs/rotated-key.pem
      OAUTH2_PROVIDER_OIDC_RSA_PRIVATE_KEYS_INACTIVE_FILE: /certs/original-key.pem
